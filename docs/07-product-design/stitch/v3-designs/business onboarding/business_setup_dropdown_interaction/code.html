<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set up your business</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "tertiary-container": "#271900",
                        "tertiary-fixed-dim": "#fcbc2f",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-tertiary-container": "#ab7b00",
                        "on-surface-variant": "#444748",
                        "inverse-on-surface": "#f0f1f2",
                        "secondary-container": "#d63c00",
                        "secondary-fixed-dim": "#ffb59f",
                        "on-secondary-fixed-variant": "#862200",
                        "surface-variant": "#e2e2e3",
                        "on-primary": "#ffffff",
                        "surface-tint": "#5f5e5e",
                        "surface-container-highest": "#e2e2e3",
                        "surface-bright": "#f9f9fa",
                        "surface-container-high": "#e8e8e9",
                        "surface-container": "#eeeeef",
                        "on-error": "#ffffff",
                        "primary-container": "#1c1b1b",
                        "surface-dim": "#dadadb",
                        "outline-variant": "#c4c7c7",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9fa",
                        "inverse-surface": "#2f3132",
                        "on-surface": "#1a1c1d",
                        "primary-fixed": "#e5e2e1",
                        "on-tertiary-fixed": "#271900",
                        "inverse-primary": "#c8c6c5",
                        "error-container": "#ffdad6",
                        "outline": "#747878",
                        "secondary": "#ab2e00",
                        "on-secondary-fixed": "#3b0a00",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "surface-container-low": "#f3f3f4",
                        "tertiary-fixed": "#ffdea6",
                        "primary": "#000000",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "background": "#f9f9fa",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#474646",
                        "on-secondary-container": "#fffbff",
                        "on-primary-container": "#858383",
                        "secondary-fixed": "#ffdbd1",
                        "on-background": "#1a1c1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "48px",
                        "space-unit": "8px",
                        "container-padding-desktop": "40px",
                        "gutter": "16px",
                        "container-padding-mobile": "20px",
                        "stack-md": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-xl": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background antialiased font-body-md md:hidden min-h-screen flex flex-col">
<!-- Top Navigation (Transactional/Focus - No Shell NavBar) -->
<header class="flex justify-between items-center px-container-mobile py-4 w-full border-b border-surface-variant bg-surface-lowest sticky top-0 z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-sm font-bold text-primary tracking-tighter">11thONUS</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col px-container-mobile pt-stack-md pb-stack-lg">
<!-- Header Section -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm">Set up your business</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's get some basic details to start.</p>
</div>
<form class="flex-grow flex flex-col gap-stack-md">
<!-- Business Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-space-unit" for="business-name">Business name</label>
<input class="w-full h-12 px-4 rounded-DEFAULT border border-outline-variant bg-surface-lowest text-primary font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="business-name" placeholder="Enter business name" type="text"/>
</div>
<!-- Phone Number -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-space-unit" for="phone-number">Phone number</label>
<div class="flex gap-2">
<div class="relative w-24">
<select class="w-full h-12 pl-3 pr-8 rounded-DEFAULT border border-outline-variant bg-surface-lowest text-primary font-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>+1</option>
<option>+44</option>
<option>+91</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[20px]" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
<input class="flex-grow h-12 px-4 rounded-DEFAULT border border-outline-variant bg-surface-lowest text-primary font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="phone-number" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Business Category (Selected State) -->
<div class="pt-4 border-t border-surface-variant">
<div class="flex justify-between items-center mb-space-unit">
<label class="block font-label-md text-label-md text-on-surface">Category</label>
<button class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" type="button">Change</button>
</div>
<div class="flex items-center gap-3 p-4 rounded-lg bg-surface border border-outline-variant">
<span class="material-symbols-outlined text-primary" data-icon="cut">cut</span>
<span class="font-body-md text-body-md text-primary font-medium">Salon</span>
<span class="material-symbols-outlined ml-auto text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Business Type (New Field shown because Category is selected) -->
<div class="animate-fade-in-up">
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm">Business type (optional)</label>
<div class="flex items-center justify-between p-4 rounded-lg border border-outline-variant bg-surface-lowest hover:border-outline cursor-pointer transition-all">
<span class="font-body-md text-body-md text-primary font-medium">Hair Salon</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
</form>
</main>
<!-- Footer Actions (Sticky Bottom) -->
<div class="mt-auto px-container-mobile pb-container-mobile pt-4 bg-background border-t border-surface-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mb-stack-md">You can update these details later.</p>
<button class="w-full h-14 bg-[#FF4F11] hover:bg-secondary-container text-on-primary font-headline-sm text-headline-sm rounded-DEFAULT transition-colors flex items-center justify-center">
            Continue
        </button>
</div>
<style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</body></html>
