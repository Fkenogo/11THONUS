<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-background selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Minimal Header (Nav Shell Suppressed for Onboarding) -->
<header class="w-full px-container-padding-desktop py-6 flex justify-between items-center bg-background border-b border-surface-variant">
<div class="font-headline-md text-headline-md font-bold text-primary tracking-tight">
            11thONUS
        </div>
<div class="flex gap-4 items-center">
<button class="font-label-md text-label-md text-primary font-bold hover:opacity-80 transition-opacity">EN</button>
<span class="text-outline-variant font-label-md text-label-md">|</span>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">FR</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-16 pb-32 px-container-padding-desktop">
<div class="w-full max-w-[640px] flex flex-col gap-stack-lg">
<!-- Progress Indicator -->
<div class="flex flex-col gap-stack-sm w-full px-2">
<div class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Step 1 of 3</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Setup Card -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-10 md:p-12 shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Header -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg text-primary">Set up your business</h1>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-stack-md">
<!-- Business Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary">Business name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-primary focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all placeholder:text-outline" placeholder="e.g. Acme Studio" type="text"/>
</div>
<!-- Business Category (Selected State) -->
<div class="flex flex-col gap-2 pt-2">
<div class="flex justify-between items-end mb-1">
<label class="font-label-md text-label-md text-primary">Business category</label>
<button class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors focus:outline-none">Change</button>
</div>
<div class="w-full bg-surface border border-surface-variant rounded-lg px-4 py-3 flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">content_cut</span>
</div>
<span class="font-body-md text-body-md text-primary font-medium flex-grow">Salon</span>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Business Type (Conditional Options based on Category) -->
<div class="flex flex-col gap-2 pt-2">
<label class="font-label-md text-label-md text-primary">Business type (optional)</label>
<button class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 flex items-center justify-between hover:border-outline hover:bg-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all group" type="button">
<span class="font-body-md text-body-md text-primary font-medium">Hair Salon</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">expand_more</span>
</button>
</div>
<!-- Business Phone Number -->
<div class="flex flex-col gap-2 pt-4 border-t border-surface-variant">
<label class="font-label-md text-label-md text-primary">Business phone number</label>
<div class="flex gap-3">
<!-- Country Code Selector -->
<button class="flex items-center justify-between gap-2 border border-outline-variant rounded-lg pl-3 pr-2 py-3 bg-surface-container-lowest hover:border-outline hover:bg-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all min-w-[100px]" type="button">
<div class="flex items-center gap-2">
<img class="w-6 h-4 object-cover rounded-[2px] shadow-sm" data-alt="A small, perfectly rectangular, high-resolution graphic of the United States flag, minimalist and modern, set against a pristine white background. The colors are slightly muted for a sophisticated UI aesthetic. Soft natural lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD89CA0YArkwSyzdzQSxJIp00Io9amrB7j4pRX0No-7jFUF7OapP-HjrLqIC8mLOvRQ0meeZFeDF0S9geNlHeZfe7sYqFbT4BXEiD1NBnsjIE2LvfV1RSB0HiUkaSRa-Gmezql69mz11illwH9LmCNaMfR7nUk5BXH2l0Vjl2uaYpCUpad02IlEpFmySqAnVPAJfno_pMu8FujtRTnI_e7TLIZlKAjPuwfc14EUkViTIYie5nJT21PV"/>
<span class="font-body-md text-body-md text-primary font-medium">+1</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px]">expand_more</span>
</button>
<!-- Phone Input -->
<input class="flex-grow bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-primary focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all placeholder:text-outline" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-4 mt-4 pt-8 border-t border-surface-variant items-center">
<button class="w-full bg-secondary hover:bg-secondary-container text-on-secondary font-label-md text-label-md py-4 px-6 rounded-lg transition-colors flex justify-center items-center gap-2 tracking-wide uppercase font-semibold">
                        Continue
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<span class="font-body-sm text-body-sm text-outline">You can update these details later.</span>
</div>
</div>
</div>
