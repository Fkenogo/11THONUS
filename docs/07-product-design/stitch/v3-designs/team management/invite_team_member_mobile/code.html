<style>
        /* Scrim and sheet animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .sheet-enter {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .scrim-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
      </style>

<body class="bg-surface font-body-md text-body-md text-on-surface antialiased h-screen overflow-hidden flex flex-col justify-end">
<!-- Mock Background Content (Team Screen) -->
<div class="absolute inset-0 z-0 p-container-padding-mobile flex flex-col gap-stack-lg opacity-40 grayscale pointer-events-none">
<header class="flex justify-between items-center h-16">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Team</h1>
</header>
<div class="flex flex-col gap-stack-md">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter h-24"></div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter h-24"></div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-gutter h-24"></div>
</div>
</div>
<!-- Modal Scrim -->
<div class="absolute inset-0 bg-primary/20 backdrop-blur-[2px] z-40 scrim-enter"></div>
<!-- Bottom Sheet Modal -->
<div class="relative z-50 bg-surface-container-lowest w-full rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.08)] flex flex-col sheet-enter pb-container-padding-mobile">
<!-- Drag Handle Indicator (Visual Only) -->
<div class="w-full flex justify-center py-stack-sm cursor-grab">
<div class="w-12 h-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-container-padding-mobile pt-stack-sm pb-stack-md flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Invite team member</h2>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-container-padding-mobile flex flex-col gap-stack-lg">
<div class="flex flex-col gap-stack-md">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT px-gutter py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Role Selector -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Role</label>
<!-- Custom Radio Group (Bento style) -->
<div class="grid grid-cols-1 gap-2">
<!-- Option 1: Admin -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-bright p-gutter hover:bg-surface-container-lowest transition-colors has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="peer sr-only" name="role" type="radio" value="admin"/>
<div class="flex w-full items-start gap-gutter">
<div class="mt-1 flex h-5 w-5 items-center justify-center rounded-full border border-outline peer-checked:border-primary">
<div class="h-2.5 w-2.5 rounded-full bg-primary opacity-0 transition-opacity peer-checked:opacity-100"></div>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-primary">Admin</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Full access to manage business profile, terms, and team members.</span>
</div>
</div>
</label>
<!-- Option 2: Editor (Pre-selected) -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-bright p-gutter hover:bg-surface-container-lowest transition-colors has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input checked="" class="peer sr-only" name="role" type="radio" value="editor"/>
<div class="flex w-full items-start gap-gutter">
<div class="mt-1 flex h-5 w-5 items-center justify-center rounded-full border border-outline peer-checked:border-primary">
<div class="h-2.5 w-2.5 rounded-full bg-primary opacity-0 transition-opacity peer-checked:opacity-100"></div>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-primary">Editor</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Can update locations and basic details. Cannot invite members.</span>
</div>
</div>
</label>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-sm pt-stack-sm border-t border-surface-variant">
<button class="w-full bg-[#FF4F11] text-on-primary font-headline-sm text-headline-sm py-3.5 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                    Send invitation
                    <span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
<button class="w-full bg-transparent text-on-surface-variant font-headline-sm text-headline-sm py-3.5 rounded-lg hover:bg-surface-container-lowest hover:text-primary active:scale-[0.98] transition-all">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
