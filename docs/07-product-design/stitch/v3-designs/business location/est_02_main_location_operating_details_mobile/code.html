<body class="bg-surface-container-lowest h-full flex flex-col antialiased selection:bg-secondary selection:text-on-secondary">
<!-- TopAppBar -->

<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<span class="font-headline-lg text-headline-lg font-black text-primary">11thONUS</span>
</div>
<div class="cursor-pointer active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<span class="font-label-md text-label-md text-primary font-bold">EN | FR</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full px-container-mobile md:px-container-desktop py-stack-lg gap-stack-lg md:gap-24">

<div class="w-full md:w-5/12 flex flex-col gap-stack-md hidden md:flex">
<!-- Progress Indicator -->
<div class="flex flex-col gap-space-unit w-full max-w-xs">

<div class="flex gap-2 w-full h-1">
<div class="flex-1 bg-secondary rounded-full"></div>
<div class="flex-1 bg-secondary rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<div class="mt-stack-lg">

<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us where your business is based to help us tailor your experience and compliance requirements.</p>
</div>

<span class="font-label-md text-label-md text-on-surface-variant uppercase">Step 2 of 3</span>
<div class="flex gap-2 w-full h-1">
<div class="flex-1 bg-secondary rounded-full"></div>
<div class="flex-1 bg-secondary rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>

<div>

<p class="font-body-md text-body-md text-on-surface-variant">Tell us where your business is based.</p>
</div>
</div>
<!-- Section 1: Where is your business? -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-stack-md mb-stack-lg shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<h2 class="font-headline-sm text-headline-sm text-primary mb-stack-md border-b border-outline-variant pb-space-unit">Where is your business?</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
<!-- Country -->
<div class="col-span-1 md:col-span-2">
<label class="min-label" for="country">Country</label>
<select class="min-select" id="country" name="country">
<option selected="" value="Burundi">Burundi</option>
<option value="Rwanda">Rwanda</option>
<option value="Kenya">Kenya</option>
</select>
</div>
<!-- City -->
<div class="col-span-1">
<label class="min-label" for="city">City</label>
<input class="min-input" id="city" name="city" type="text" value="Bujumbura"/>
</div>
<!-- Location Name -->
<div class="col-span-1">
<label class="min-label" for="location_name">Location name</label>
<input class="min-input" id="location_name" name="location_name" type="text" value="Main Branch"/>
</div>
<!-- Address -->
<div class="col-span-1 md:col-span-2">
<label class="min-label" for="address">Address (optional)</label>
<input class="min-input" id="address" name="address" placeholder="123 Maple St" type="text"/>
</div>
</div>
</div>
<!-- Section 2: Operating details -->
<div class="bg-surface rounded-xl border border-surface-variant p-stack-md mb-[100px] md:mb-0">
<div class="flex items-center gap-space-unit mb-stack-md pb-space-unit border-b border-surface-variant">

</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
<!-- Currency -->
<div class="col-span-1">
<label class="min-label" for="currency">Currency</label>
<select class="min-select bg-surface" id="currency" name="currency">
<option selected="" value="BIF">BIF — Burundian Franc</option>
<option value="USD">USD — US Dollar</option>
</select>
</div>
<!-- Timezone -->
<div class="col-span-1">
<label class="min-label" for="timezone">Timezone</label>
<select class="min-select bg-surface" id="timezone" name="timezone">
<option selected="" value="Africa/Bujumbura">Africa/Bujumbura</option>
<option value="UTC">UTC</option>
</select>
</div>
</div>
</div>
<!-- Desktop Actions (Hidden on mobile, uses BottomNavBar instead) -->
<div class="hidden md:flex justify-end items-center gap-stack-md mt-stack-lg pt-stack-md border-t border-outline-variant">

<span class="material-symbols-outlined ml-2" data-icon="arrow_forward">arrow_forward</span>
</button>
