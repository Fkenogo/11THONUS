<body class="text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-sm text-headline-sm fixed top-0 w-full z-50 border-b border-outline-variant flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop h-16 cursor-pointer active:opacity-80">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-headline-sm text-headline-sm font-bold tracking-tight text-primary">PROGRES</span>
</div>
<div class="text-on-surface-variant hover:bg-surface-container-low transition-colors px-2 py-1 rounded">
<span>EN|FR</span>
</div>
</header>
<div class="flex flex-1 pt-16">
<!-- Navigation Drawer (Hidden on mobile, visible on md+) -->
<!-- Suppressed Nav Shell for linear task (editing) but keeping structural sidebar for desktop context as requested in prompt "Header remains consistent" and it's a sub-page of Locations. Since it's a specific edit task, we might suppress, but the prompt says "reached from Locations list". We'll include it for context but focused canvas. Actually, rule says: "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow -> suppress nav shell". Let's suppress the side nav for focused editing. -->
<!-- Main Content Canvas -->
<main class="flex-1 max-w-3xl mx-auto w-full px-container-padding-mobile md:px-container-padding-desktop py-stack-lg">
<!-- Breadcrumbs / Back Action -->
<div class="mb-stack-md flex items-center gap-2 text-on-surface-variant font-label-md text-label-md uppercase tracking-wider">
<a class="hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Locations
                </a>
</div>
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">Edit Location</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Update the details for this business location.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack-md md:p-stack-lg shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<form class="space-y-stack-md">
<!-- Location Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary uppercase" for="location_name">Location Name</label>
<input class="w-full bg-surface border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="location_name" name="location_name" type="text" value="Downtown Hub"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Country -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary uppercase" for="country">Country</label>
<input class="w-full bg-surface border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="country" name="country" type="text" value="Canada"/>
</div>
<!-- City -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary uppercase" for="city">City</label>
<input class="w-full bg-surface border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="city" name="city" type="text" value="Toronto"/>
</div>
</div>
<!-- Address -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary uppercase" for="address">Full Address</label>
<textarea class="w-full bg-surface border border-outline-variant rounded px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="address" name="address" rows="3">123 King St W, Suite 400</textarea>
</div>
<!-- Actions -->
<div class="pt-stack-md border-t border-outline-variant mt-stack-md flex flex-col-reverse md:flex-row justify-end items-center gap-stack-sm md:gap-4">
<button class="w-full md:w-auto px-6 py-3 font-label-md text-label-md text-primary border border-outline-variant rounded hover:bg-surface-container-low transition-colors uppercase tracking-wider" type="button">
                            Cancel
                        </button>
<button class="w-full md:w-auto px-6 py-3 font-label-md text-label-md text-on-primary bg-secondary rounded hover:opacity-90 transition-opacity uppercase tracking-wider flex items-center justify-center gap-2" type="submit">
                            Save Changes
                            <span class="material-symbols-outlined text-[16px]">check</span>
</button>
</div>
</form>
</div>
</main>
</div>
