# 11THONUS-CI-CONT-003 — TEMPORARY CircleCI CONTINUITY PILOT CONFIG (GitHub OAuth API-trigger model)
#
# TEMPORARY, REVERSIBLE, ON HOLD until Founder authorisation. GitHub Actions
# (`.github/workflows/ci.yml`) remains the primary CI system. This file lives only on the pilot
# branch `docs/ci-cont-001-circleci-assessment`; it is never part of any PR under test.
# A CircleCI pass is independent evidence; it is NOT a GitHub Actions pass.
#
# Trigger model (GitHub OAuth pipeline, manual API trigger — same model as the Miledge Creative
# Engine pilot): POST /api/v2/project/gh/Fkenogo/11THONUS/pipeline/run with
#   config.branch = checkout.branch = docs/ci-cont-001-circleci-assessment  (OAuth requires equal)
#   parameters.expected_sha, parameters.pr_number  (both REQUIRED, validated, authoritative)
# No `pipeline.event.*` (GitHub App) values are used anywhere. A plain push starts no workflow.
#
# Source handling: the CircleCI `checkout` step is deliberately NOT used. The repository is public,
# so the PR head is fetched anonymously over HTTPS (`refs/pull/<n>/head`, depth 1). No deploy key or
# SSH identity is loaded, and the job asserts that none is reachable before any PR code runs.
# Pipeline values reach the shell only through quoted `environment:` entries, never inside commands.
# Credential preflight: names-only environment audit; CircleCI's auto-issued OIDC variables are
# allowed exactly (and unset for later steps); every other credential-like name fails the job.

version: 2.1

parameters:
  expected_sha:
    type: string
    default: ""
  pr_number:
    type: string
    default: ""

jobs:
  verify:
    docker:
      - image: cimg/node:20.19
      # Same image, credential, database and port as the GitHub Actions service container.
      - image: postgres:16-alpine
        command: ["postgres", "-p", "28110"]
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eleventhonus_platform_test
    resource_class: large # Docker large: 4 vCPU / 8 GB; 20 credits/min (Gen1) or 24 (Gen2)
    environment:
      CI: "true"
    steps:
      - run:
          name: Assert no checkout credentials or secrets are reachable
          command: |
            set -eu
            # No `checkout` step has run, so no key should exist. Assert it (defence in depth).
            [ -n "${SSH_AUTH_SOCK:-}" ] && ssh-add -D >/dev/null 2>&1 || true
            if [ -n "${SSH_AUTH_SOCK:-}" ] && ssh-add -l >/dev/null 2>&1; then
              echo "FAIL: an SSH identity is loaded in the agent"; exit 1
            fi
            rm -rf "$HOME/.ssh" "$HOME/.gitconfig" "$HOME/.config/git" "$HOME/.git-credentials"

            # Environment audit — NAMES ONLY, never values. Auto-issued CircleCI OIDC variables are the
            # only credential-like names that are legitimate; they are matched EXACTLY (any other
            # name containing TOKEN/SECRET/PASS/KEY/CREDENTIAL/AUTH/PRIVATE/CERT, including other
            # CIRCLE_* names, fails). Ordinary built-ins (CIRCLE_*, CI, image ENV) are not rejected.
            env | cut -d= -f1 | sort > /tmp/env-names.txt
            echo "Environment variable names present ($(wc -l < /tmp/env-names.txt)):"; tr '\n' ' ' < /tmp/env-names.txt; echo
            LEAK="$(grep -Ei '(TOKEN|SECRET|PASS|KEY|CREDENTIAL|AUTH|PRIVATE|CERT)' /tmp/env-names.txt | grep -Fvx -e CIRCLE_OIDC_TOKEN -e CIRCLE_OIDC_TOKEN_V2 || true)"
            if [ -n "$LEAK" ]; then
              echo "FAIL: credential-like environment variable names are present (project/context vars must be empty):"
              echo "$LEAK"; exit 1
            fi
            if grep -Fxq -e CIRCLE_OIDC_TOKEN -e CIRCLE_OIDC_TOKEN_V2 /tmp/env-names.txt; then
              echo "NOTE: CircleCI-issued OIDC variables present (legitimate); removing them from all later steps"
            fi
            # BASH_ENV is sourced by every later step's shell; PR code then never sees the OIDC tokens.
            echo 'unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2' >> "${BASH_ENV:-/dev/null}"
            echo "OK: no SSH identity, no credential files, no unexpected credential-like env var names"

      - run:
          name: Exact-head verification (fail closed)
          environment:
            P_EXPECTED_SHA: "<< pipeline.parameters.expected_sha >>"
            P_PR_NUMBER: "<< pipeline.parameters.pr_number >>"
            P_PIPELINE_ID: "<< pipeline.id >>"
            P_PIPELINE_NUMBER: "<< pipeline.number >>"
            G_BRANCH: "<< pipeline.git.branch >>"
            G_REVISION: "<< pipeline.git.revision >>"
          command: |
            set -u
            EVIDENCE=/tmp/exact-head-evidence.json
            REPO_URL=https://github.com/Fkenogo/11THONUS.git
            LIVE=""; FETCHED=""; CHECKED_OUT=""; REASON="unknown failure"
            emit() {
              EV_RESULT="$1" EV_LIVE="$LIVE" EV_FETCHED="$FETCHED" EV_CHECKED="$CHECKED_OUT" EV_REASON="$REASON" node -e '
                const e = process.env;
                const o = {
                  result: e.EV_RESULT, reason: e.EV_REASON,
                  pr_number: e.P_PR_NUMBER, expected_sha: e.P_EXPECTED_SHA,
                  live_pr_head_sha: e.EV_LIVE, fetched_sha: e.EV_FETCHED, checked_out_sha: e.EV_CHECKED,
                  circleci: {
                    pipeline_id: e.P_PIPELINE_ID, pipeline_number: e.P_PIPELINE_NUMBER,
                    workflow_id: e.CIRCLE_WORKFLOW_ID, job: e.CIRCLE_JOB, build_num: e.CIRCLE_BUILD_NUM,
                    build_url: e.CIRCLE_BUILD_URL, config_branch: e.G_BRANCH,
                    config_revision_NOT_VERIFIED_AS_TESTED_CODE: e.G_REVISION
                  },
                  timestamp_utc: new Date().toISOString()
                };
                require("fs").writeFileSync("/tmp/exact-head-evidence.json", JSON.stringify(o, null, 2) + "\n");
                console.log(JSON.stringify(o, null, 2));'
            }
            finish() { rc=$?; if [ "$rc" -eq 0 ]; then emit PASS; else emit FAIL; fi; }
            trap finish EXIT
            fail() { REASON="$1"; echo "FAIL: $1" >&2; exit 1; }
            if [ -n "${CIRCLE_OIDC_TOKEN:-}${CIRCLE_OIDC_TOKEN_V2:-}" ]; then
              echo "WARNING: CircleCI OIDC variable(s) still visible after BASH_ENV unset (no cloud trust is configured for this project; inert)" >&2
            fi

            printf '%s' "$P_EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "expected_sha missing or not a 40-char lowercase SHA"
            printf '%s' "$P_PR_NUMBER" | grep -Eq '^[1-9][0-9]{0,6}$' || fail "pr_number missing or not a positive integer"
            # Pilot allowlist: this temporary pilot is authorised for PR #312 only.
            [ "$P_PR_NUMBER" = "312" ] || fail "pr_number $P_PR_NUMBER is not authorised for this pilot (only 312)"

            # 1. Live GitHub PR head (public API, no credential).
            PRJSON="$(curl -fsS --max-time 30 "https://api.github.com/repos/Fkenogo/11THONUS/pulls/$P_PR_NUMBER")" || fail "could not read PR $P_PR_NUMBER from GitHub"
            LIVE="$(printf '%s' "$PRJSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).head.sha))')" || fail "unparsable PR response"
            PRSTATE="$(printf '%s' "$PRJSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).state))')"
            [ "$PRSTATE" = "open" ] || fail "PR $P_PR_NUMBER is not open (state: $PRSTATE)"
            [ "$LIVE" = "$P_EXPECTED_SHA" ] || fail "live PR head ($LIVE) != expected_sha"

            # 2. Anonymous fetch of the PR head ref (no credentials, no credential helpers).
            export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
            mkdir -p "$HOME/project" && cd "$HOME/project"
            git init -q . && git remote add origin "$REPO_URL"
            git fetch -q --no-tags --depth=1 origin "refs/pull/$P_PR_NUMBER/head" || fail "could not fetch refs/pull/$P_PR_NUMBER/head"
            FETCHED="$(git rev-parse --verify FETCH_HEAD)"
            [ "$FETCHED" = "$P_EXPECTED_SHA" ] || fail "fetched SHA ($FETCHED) != expected_sha"

            # 3. Check out and confirm.
            git checkout -q --detach FETCH_HEAD
            CHECKED_OUT="$(git rev-parse HEAD)"
            [ "$CHECKED_OUT" = "$P_EXPECTED_SHA" ] || fail "checked-out SHA ($CHECKED_OUT) != expected_sha"
            REASON="expected = live = fetched = checked-out"
            echo "RESULT: EXACT-HEAD MATCH CONFIRMED"

      - run:
          name: Install pnpm 9.15.9
          working_directory: ~/project
          command: npm install -g pnpm@9.15.9
      - run:
          name: Install JDK 21 (Firestore Emulator requires Java >= 21) and psql
          working_directory: ~/project
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-21-jre-headless postgresql-client
            java -version
      - run:
          name: Install dependencies (frozen lockfile)
          working_directory: ~/project
          command: pnpm install --frozen-lockfile
      - run:
          name: Wait for PostgreSQL service container
          working_directory: ~/project
          command: for i in $(seq 1 30); do PGPASSWORD=postgres pg_isready -h localhost -p 28110 -U postgres && exit 0; sleep 2; done; exit 1

      - run: { name: Build, working_directory: ~/project, command: pnpm build }
      - run: { name: Lint, working_directory: ~/project, command: pnpm lint }
      - run: { name: Format check, working_directory: ~/project, command: pnpm format:check }
      - run: { name: Typecheck, working_directory: ~/project, command: pnpm typecheck }
      - run:
          {
            name: Unit / component tests,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm test,
          }
      - run:
          name: PostgreSQL integration tests (Firestore emulator wrapped)
          working_directory: ~/project
          no_output_timeout: 25m
          command: >-
            pnpm exec firebase emulators:exec --only firestore --project demo-11thonus
            "PLATFORM_ENV=test PLATFORM_POSTGRES_URL=postgres://postgres:postgres@localhost:28110/eleventhonus_platform_test pnpm --filter functions test:postgres"
      - run:
          {
            name: Install Playwright Chromium,
            working_directory: ~/project,
            command: pnpm exec playwright install --with-deps chromium,
          }
      - run:
          {
            name: Playwright e2e,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm test:e2e,
          }
      - run:
          {
            name: Founder Preview tooling tests,
            working_directory: ~/project,
            command: pnpm test:preview-tooling,
          }
      - run:
          name: Founder Preview cross-project port-isolation acceptance
          working_directory: ~/project
          environment:
            PREVIEW_POSTGRES_URL: postgres://postgres:postgres@localhost:28110/eleventhonus_platform_local
            PGPASSWORD: postgres
          command: |
            psql -h localhost -p 28110 -U postgres -c "CREATE DATABASE eleventhonus_platform_local"
            node tests/preview/cross-project-acceptance.mjs
      - run:
          name: Stop Founder Preview (cleanup)
          working_directory: ~/project
          when: always
          command: pnpm preview:stop || true
      - run:
          {
            name: Firebase Emulator Suite validation,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm emulators:validate,
          }

      - run:
          name: Final exact-head re-assertion
          working_directory: ~/project
          when: always
          command: |
            echo "final HEAD  $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
      - store_artifacts:
          path: /tmp/exact-head-evidence.json
          destination: exact-head-evidence.json
          when: always
      - store_artifacts:
          path: ~/project/playwright-report
          destination: playwright-report
          when: always
      - store_artifacts:
          path: ~/project/test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: ~/project/.preview/logs
          destination: preview-logs
          when: always

workflows:
  # One workflow, one job, one run per API trigger. Starts only when `expected_sha` is supplied,
  # so ordinary pushes (OAuth all-pushes trigger, if any) start nothing and consume no credits.
  temporary-ci-continuity:
    when: << pipeline.parameters.expected_sha >>
    jobs:
      - verify:
          name: circleci-continuity-verify
