# 11THONUS-CI-CONT-003 — TEMPORARY CircleCI CONTINUITY PILOT CONFIG (GitHub OAuth API-trigger model)
#
# TEMPORARY, REVERSIBLE, ON HOLD until Founder authorisation. GitHub Actions
# (`.github/workflows/ci.yml`) remains the primary CI system. This file lives only on the pilot
# branch `docs/ci-cont-001-circleci-assessment`; it is never part of any PR under test.
# A CircleCI pass is independent evidence; it is NOT a GitHub Actions pass.
#
# Trigger model (GitHub OAuth pipeline, manual API trigger — same model as the Miledge Creative
# Engine pilot): POST /api/v2/project/gh/Fkenogo/11THONUS/pipeline/run with
#   config.branch = checkout.branch = docs/ci-cont-001-circleci-assessment  (OAuth requires equal)
#   parameters.expected_sha, parameters.pr_number  (both REQUIRED, validated, authoritative)
# No `pipeline.event.*` (GitHub App) values are used anywhere. A plain push starts no workflow.
#
# Source handling: the CircleCI `checkout` step is deliberately NOT used. The repository is public,
# so the PR head is fetched anonymously over HTTPS (`refs/pull/<n>/head`, depth 1). No deploy key or
# SSH identity is loaded, and the job asserts that none is reachable before any PR code runs.
# Pipeline values reach the shell only through quoted `environment:` entries, never inside commands.
# Credential preflight: names-only environment audit; CircleCI's auto-issued OIDC variables are
# allowed exactly (and unset for later steps); every other credential-like name fails the job.

version: 2.1

parameters:
  expected_sha:
    type: string
    default: ""
  pr_number:
    type: string
    default: ""

commands:
  # Fail-closed gate placed immediately before every step that executes fetched PR code. Each step's
  # shell sources $BASH_ENV (which unsets the OIDC variables and re-checks), so this gate observes the
  # same environment the application step will see. Static messages only: values are never printed.
  oidc_guard:
    steps:
      - run:
          name: OIDC and SSH-agent isolation gate (fail closed before application code)
          command: |
            if [ -n "${CIRCLE_OIDC_TOKEN-}${CIRCLE_OIDC_TOKEN_V2-}" ]; then
              echo "FAIL: a CircleCI OIDC variable is present; refusing to execute application code" >&2
              exit 1
            fi
            if [ -n "${SSH_AUTH_SOCK-}${SSH_AGENT_PID-}" ]; then
              echo "FAIL: an SSH agent variable is present; refusing to execute application code" >&2
              exit 1
            fi
            if [ "${PILOT_ISOLATION_ACTIVE-}" != 1 ]; then
              echo "FAIL: the BASH_ENV isolation file was not sourced; refusing to execute application code" >&2
              exit 1
            fi
            echo "OK: OIDC and SSH agent variables are absent and the BASH_ENV isolation is active"

jobs:
  verify:
    docker:
      - image: cimg/node:20.19
      # Same image, credential, database and port as the GitHub Actions service container.
      - image: postgres:16-alpine
        command: ["postgres", "-p", "28110"]
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eleventhonus_platform_test
    resource_class: large # Docker large: 4 vCPU / 8 GB; 20 credits/min (Gen1) or 24 (Gen2)
    environment:
      CI: "true"
    steps:
      - run:
          name: Assert no checkout credentials or secrets are reachable
          command: |
            set -eu
            # No `checkout` step has run, so no key should exist. Assert it BEFORE deleting anything, and
            # do not rely on `ssh-add`: query the agent socket directly (SSH agent protocol, request 11,
            # identities answer 12) with node. 0 identities or no listener = OK; any identity, or an
            # unexpected reply, fails closed. Nothing is ever deleted from a loaded agent.
            if [ -n "${SSH_AUTH_SOCK:-}" ]; then
              AGENT="$(node -e '
                const net = require("net");
                const out = (v) => { console.log(v); process.exit(0); };
                const s = net.connect(process.argv[1]);
                let b = Buffer.alloc(0);
                s.setTimeout(5000, () => out("unreachable"));
                s.on("error", () => out("unreachable"));
                s.on("connect", () => s.write(Buffer.from([0, 0, 0, 1, 11])));
                s.on("data", (d) => {
                  b = Buffer.concat([b, d]);
                  if (b.length >= 9) out(b[4] === 12 ? String(b.readUInt32BE(5)) : "unexpected");
                });' "$SSH_AUTH_SOCK" 2>/dev/null || echo error)"
              case "$AGENT" in
                0|unreachable) echo "OK: SSH agent socket present but exposes no identities ($AGENT)" ;;
                *) echo "FAIL: SSH agent reports usable identities or an unverifiable state ($AGENT)"; exit 1 ;;
              esac
            fi
            if command -v ssh-add >/dev/null 2>&1 && [ -n "${SSH_AUTH_SOCK:-}" ]; then
              if ssh-add -l >/dev/null 2>&1; then echo "FAIL: ssh-add lists a loaded SSH identity"; exit 1; fi
            fi
            if [ -n "${GIT_SSH:-}${GIT_SSH_COMMAND:-}" ]; then
              echo "FAIL: GIT_SSH or GIT_SSH_COMMAND is set"; exit 1
            fi
            # Private key material on disk (file NAMES only; never contents) fails closed before cleanup.
            KEYFILES="$( { grep -rIl -E 'BEGIN [A-Z ]*PRIVATE KEY' "$HOME/.ssh" 2>/dev/null; ls "$HOME"/.ssh/id_* 2>/dev/null; } | sort -u || true)"
            if [ -n "$KEYFILES" ]; then
              echo "FAIL: SSH private key material found under ~/.ssh:"; echo "$KEYFILES"; exit 1
            fi
            rm -rf "$HOME/.ssh" "$HOME/.gitconfig" "$HOME/.config/git" "$HOME/.git-credentials"

            # Environment audit — NAMES ONLY, never values. Credential-like names that are legitimate in a
            # CircleCI job and matched EXACTLY: the auto-issued OIDC pair and the agent socket SSH_AUTH_SOCK
            # (its identities are verified empty above, and it is unset for later steps). Any other
            # name containing TOKEN/SECRET/PASS/KEY/CREDENTIAL/AUTH/PRIVATE/CERT, including other
            # CIRCLE_* names, fails). Ordinary built-ins (CIRCLE_*, CI, image ENV) are not rejected.
            env | cut -d= -f1 | sort > /tmp/env-names.txt
            echo "Environment variable names present ($(wc -l < /tmp/env-names.txt)):"; tr '\n' ' ' < /tmp/env-names.txt; echo
            LEAK="$(grep -Ei '(TOKEN|SECRET|PASS|KEY|CREDENTIAL|AUTH|PRIVATE|CERT)' /tmp/env-names.txt | grep -Fvx -e CIRCLE_OIDC_TOKEN -e CIRCLE_OIDC_TOKEN_V2 -e SSH_AUTH_SOCK || true)"
            if [ -n "$LEAK" ]; then
              echo "FAIL: credential-like environment variable names are present (project/context vars must be empty):"
              echo "$LEAK"; exit 1
            fi
            if grep -Fxq -e CIRCLE_OIDC_TOKEN -e CIRCLE_OIDC_TOKEN_V2 /tmp/env-names.txt; then
              echo "NOTE: CircleCI-issued OIDC variables present (legitimate); removing them from all later steps"
            fi
            # $BASH_ENV is sourced by the shell of every later step, before its command runs. It unsets the
            # OIDC and SSH-agent variables and then re-checks, aborting the step (exit 1) if any survives,
            # so fetched application scripts never start with them in their environment.
            # $BASH_ENV is provided by CircleCI but the file may not exist yet (hosted pipeline 4): validate the
            # path, never follow a symlink or write into a credential location, then open it for append
            # (creating it with mode 0600) and verify. Any problem fails the job before PR code can run.
            be_fail() { echo "FAIL: $1; OIDC/SSH isolation impossible" >&2; exit 1; }
            [ -n "${BASH_ENV:-}" ] || be_fail "BASH_ENV is unset or empty"
            case "$BASH_ENV" in /*) ;; *) be_fail "BASH_ENV is not an absolute path" ;; esac
            case "$BASH_ENV" in *[[:cntrl:]]*) be_fail "BASH_ENV contains control characters" ;; esac
            [ ! -L "$BASH_ENV" ] || be_fail "BASH_ENV is a symbolic link"
            BE_DIR="$(cd "$(dirname "$BASH_ENV")" 2>/dev/null && pwd -P)" || be_fail "BASH_ENV directory does not exist"
            HOME_REAL="$(cd "$HOME" 2>/dev/null && pwd -P || echo "$HOME")"
            case "$BE_DIR/$(basename "$BASH_ENV")" in
              "$HOME_REAL"/.ssh/*|"$HOME_REAL"/.aws/*|"$HOME_REAL"/.gnupg/*|"$HOME_REAL"/.config/git/*|"$HOME_REAL"/.git-credentials|"$HOME_REAL"/.gitconfig|"$HOME_REAL"/.netrc|*/id_rsa|*/id_ed25519|*/id_ecdsa|*/authorized_keys|*/known_hosts)
                be_fail "BASH_ENV points into a credential location" ;;
            esac
            if [ -e "$BASH_ENV" ]; then
              { [ -f "$BASH_ENV" ] && [ -O "$BASH_ENV" ]; } || be_fail "BASH_ENV exists but is not a regular file owned by this user"
            fi
            ( umask 077; : >> "$BASH_ENV" ) 2>/dev/null || be_fail "BASH_ENV cannot be created or opened for append"
            { [ -f "$BASH_ENV" ] && [ ! -L "$BASH_ENV" ] && [ -w "$BASH_ENV" ]; } || be_fail "BASH_ENV verification after creation failed"
            {
              echo 'unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2 SSH_AUTH_SOCK SSH_AGENT_PID 2>/dev/null'
              echo 'if [ -n "${CIRCLE_OIDC_TOKEN-}${CIRCLE_OIDC_TOKEN_V2-}${SSH_AUTH_SOCK-}${SSH_AGENT_PID-}" ]; then'
              echo '  echo "FAIL: a CircleCI OIDC or SSH-agent variable survived unset; aborting step" >&2'
              echo '  exit 1'
              echo 'fi'
              echo 'export PILOT_ISOLATION_ACTIVE=1'
            } >> "$BASH_ENV"
            # Informational only and never fatal (grep exits 2 on unreadable /proc entries; the job runs with
            # `-eo pipefail`) — names/counts, never values: other same-user processes that still hold the
            # variable in their own environment, which an unset in this shell cannot remove.
            if [ -d /proc ]; then
              N="$( { grep -l -a -E '(^|\x00)CIRCLE_OIDC_TOKEN(_V2)?=' /proc/[0-9]*/environ 2>/dev/null || true; } | wc -l | tr -d ' ')"
              echo "INFO: $N process environment(s) other than this step may hold a CircleCI OIDC variable (the agent itself); trust to any cloud role is unconfigured (see report)"
            fi
            echo "OK: no SSH identity, no credential files, no unexpected credential-like env var names"

      - run:
          name: Runtime resource diagnostics (informational, never fatal)
          command: |
            # Why: pipeline 5 failed from CPU oversubscription; record what the executor really exposes.
            # Numbers and paths only: no environment values are printed. Absent files are not errors.
            set +e
            echo "nproc: $(nproc 2>/dev/null)"
            echo "node availableParallelism: $(node -p 'require("os").availableParallelism()' 2>/dev/null)  cpus().length: $(node -p 'require("os").cpus().length' 2>/dev/null)"
            for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
              if [ -r "$f" ]; then echo "$f: $(cat "$f" 2>/dev/null)"; fi
            done
            echo "MemTotal: $(awk '/^MemTotal/ {print $2 " kB"}' /proc/meminfo 2>/dev/null)"
            echo "parallelism caps in this pipeline: vitest --maxWorkers=2 (per package), playwright --workers=2"
            exit 0

      - run:
          name: Exact-head verification (fail closed)
          environment:
            P_EXPECTED_SHA: "<< pipeline.parameters.expected_sha >>"
            P_PR_NUMBER: "<< pipeline.parameters.pr_number >>"
            P_PIPELINE_ID: "<< pipeline.id >>"
            P_PIPELINE_NUMBER: "<< pipeline.number >>"
            G_BRANCH: "<< pipeline.git.branch >>"
            G_REVISION: "<< pipeline.git.revision >>"
          command: |
            set -u
            EVIDENCE=/tmp/exact-head-evidence.json
            REPO_URL=https://github.com/Fkenogo/11THONUS.git
            LIVE=""; FETCHED=""; CHECKED_OUT=""; REASON="unknown failure"
            emit() {
              EV_RESULT="$1" EV_LIVE="$LIVE" EV_FETCHED="$FETCHED" EV_CHECKED="$CHECKED_OUT" EV_REASON="$REASON" node -e '
                const e = process.env;
                const o = {
                  result: e.EV_RESULT, reason: e.EV_REASON,
                  pr_number: e.P_PR_NUMBER, expected_sha: e.P_EXPECTED_SHA,
                  live_pr_head_sha: e.EV_LIVE, fetched_sha: e.EV_FETCHED, checked_out_sha: e.EV_CHECKED,
                  circleci: {
                    pipeline_id: e.P_PIPELINE_ID, pipeline_number: e.P_PIPELINE_NUMBER,
                    workflow_id: e.CIRCLE_WORKFLOW_ID, job: e.CIRCLE_JOB, build_num: e.CIRCLE_BUILD_NUM,
                    build_url: e.CIRCLE_BUILD_URL, config_branch: e.G_BRANCH,
                    config_revision_NOT_VERIFIED_AS_TESTED_CODE: e.G_REVISION
                  },
                  timestamp_utc: new Date().toISOString()
                };
                require("fs").writeFileSync("/tmp/exact-head-evidence.json", JSON.stringify(o, null, 2) + "\n");
                console.log(JSON.stringify(o, null, 2));'
            }
            finish() { rc=$?; if [ "$rc" -eq 0 ]; then emit PASS; else emit FAIL; fi; }
            trap finish EXIT
            fail() { REASON="$1"; echo "FAIL: $1" >&2; exit 1; }

            printf '%s' "$P_EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "expected_sha missing or not a 40-char lowercase SHA"
            printf '%s' "$P_PR_NUMBER" | grep -Eq '^[1-9][0-9]{0,6}$' || fail "pr_number missing or not a positive integer"
            # Pilot allowlist: this temporary pilot is authorised for PR #312 only.
            [ "$P_PR_NUMBER" = "312" ] || fail "pr_number $P_PR_NUMBER is not authorised for this pilot (only 312)"

            # 1. Live GitHub PR head (public API, no credential).
            PRJSON="$(curl -fsS --max-time 30 "https://api.github.com/repos/Fkenogo/11THONUS/pulls/$P_PR_NUMBER")" || fail "could not read PR $P_PR_NUMBER from GitHub"
            LIVE="$(printf '%s' "$PRJSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).head.sha))')" || fail "unparsable PR response"
            PRSTATE="$(printf '%s' "$PRJSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).state))')"
            [ "$PRSTATE" = "open" ] || fail "PR $P_PR_NUMBER is not open (state: $PRSTATE)"
            [ "$LIVE" = "$P_EXPECTED_SHA" ] || fail "live PR head ($LIVE) != expected_sha"

            # 2. Anonymous fetch of the PR head ref (no credentials, no credential helpers).
            export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
            mkdir -p "$HOME/project" && cd "$HOME/project"
            git init -q . && git remote add origin "$REPO_URL"
            git fetch -q --no-tags --depth=1 origin "refs/pull/$P_PR_NUMBER/head" || fail "could not fetch refs/pull/$P_PR_NUMBER/head"
            FETCHED="$(git rev-parse --verify FETCH_HEAD)"
            [ "$FETCHED" = "$P_EXPECTED_SHA" ] || fail "fetched SHA ($FETCHED) != expected_sha"

            # 3. Check out and confirm.
            git checkout -q --detach FETCH_HEAD
            CHECKED_OUT="$(git rev-parse HEAD)"
            [ "$CHECKED_OUT" = "$P_EXPECTED_SHA" ] || fail "checked-out SHA ($CHECKED_OUT) != expected_sha"
            REASON="expected = live = fetched = checked-out"
            echo "RESULT: EXACT-HEAD MATCH CONFIRMED"

      - run:
          name: Install pnpm 9.15.9
          working_directory: ~/project
          command: |
            # cimg/node ships pnpm 10 and its npm prefix (/usr/local) is not writable by the job user, so a
            # plain `npm install -g` fails with EACCES: install the pinned 9.15.9 under ~/.local instead and
            # put it first on PATH for all later steps (via BASH_ENV).
            npm install -g --prefix "$HOME/.local" pnpm@9.15.9
            [ -n "${BASH_ENV:-}" ] && echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            test "$("$HOME/.local/bin/pnpm" -v)" = "9.15.9"
      - run:
          name: Install JDK 21 (Firestore Emulator requires Java >= 21) and psql
          working_directory: ~/project
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-21-jre-headless postgresql-client
            java -version
      - oidc_guard
      - run:
          name: Install dependencies (frozen lockfile)
          working_directory: ~/project
          command: pnpm install --frozen-lockfile
      - run:
          name: Wait for PostgreSQL service container
          working_directory: ~/project
          command: for i in $(seq 1 30); do PGPASSWORD=postgres pg_isready -h localhost -p 28110 -U postgres && exit 0; sleep 2; done; exit 1

      - oidc_guard
      - run: { name: Build, working_directory: ~/project, command: pnpm build }
      - oidc_guard
      - run: { name: Lint, working_directory: ~/project, command: pnpm lint }
      - oidc_guard
      - run: { name: Format check, working_directory: ~/project, command: pnpm format:check }
      - oidc_guard
      - run: { name: Typecheck, working_directory: ~/project, command: pnpm typecheck }
      - oidc_guard
      - run:
          {
            name: Unit / component tests,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm test -- --maxWorkers=2,
          }
      - oidc_guard
      - run:
          name: PostgreSQL integration tests (Firestore emulator wrapped)
          working_directory: ~/project
          no_output_timeout: 25m
          command: >-
            pnpm exec firebase emulators:exec --only firestore --project demo-11thonus
            "PLATFORM_ENV=test PLATFORM_POSTGRES_URL=postgres://postgres:postgres@localhost:28110/eleventhonus_platform_test pnpm --filter functions test:postgres"
      - oidc_guard
      - run:
          {
            name: Install Playwright Chromium,
            working_directory: ~/project,
            command: pnpm exec playwright install --with-deps chromium,
          }
      - oidc_guard
      - run:
          {
            name: Playwright e2e,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm test:e2e --workers=2,
          }
      - oidc_guard
      - run:
          {
            name: Founder Preview tooling tests,
            working_directory: ~/project,
            command: pnpm test:preview-tooling,
          }
      - oidc_guard
      - run:
          name: Founder Preview cross-project port-isolation acceptance
          working_directory: ~/project
          environment:
            PREVIEW_POSTGRES_URL: postgres://postgres:postgres@localhost:28110/eleventhonus_platform_local
            PGPASSWORD: postgres
            NODE_OPTIONS: --require /tmp/ci-auth-emulator-connection-close.cjs
          command: |
            # CI-only mitigation of a latent race in tests/preview (pipeline 6; CI-CONT-007H/007I). The preview
            # tooling pools HTTP keep-alive sockets to the Auth emulator, which closes idle connections after
            # 5 s (`Keep-Alive: timeout=5`), but it runs its reference-data seeds with spawnSync, which blocks the
            # Node event loop: when that window exceeds 5 s (slow or CPU-capped executors) the client cannot
            # notice the closed socket and the next POST (accounts:signUp) fails with UND_ERR_SOCKET.
            # GitHub Actions stays below the threshold (~1.8 s).
            # Scope: this step only (NODE_OPTIONS lives in this step's environment; the file is deleted on exit).
            # The preload touches `fetch` calls to exactly http://127.0.0.1:<emulators.auth.port from firebase.json>
            # (the endpoint the preview tooling uses, asserted equal to its own port map), adds `Connection: close`
            # only when the caller set no Connection header, and changes nothing else. Repository files are not modified.
            trap 'rm -f /tmp/ci-auth-emulator-connection-close.cjs' EXIT
            printf '%s\n' \
              'const of = globalThis.fetch;' \
              'let announced = false;' \
              'globalThis.fetch = function (input, init) {' \
              '  try {' \
              '    const port = process.env.CI_AUTH_EMULATOR_PORT;' \
              '    const u = port ? new URL(String((input && input.url) || input)) : null;' \
              '    if (u && u.hostname === "127.0.0.1" && u.port === port) {' \
              '      const h = new Headers((init && init.headers) || (input && input.headers) || undefined);' \
              '      if (!h.has("connection")) {' \
              '        h.set("connection", "close");' \
              '        if (!announced) { announced = true; console.error("[ci-shim] Connection: close applied to Auth emulator requests (127.0.0.1:" + port + ")"); }' \
              '        return of(input, Object.assign({}, init, { headers: h }));' \
              '      }' \
              '    }' \
              '  } catch (e) { /* fall through to the unmodified fetch */ }' \
              '  return of(input, init);' \
              '};' > /tmp/ci-auth-emulator-connection-close.cjs
            CI_AUTH_EMULATOR_PORT="$(node -p 'require("./firebase.json").emulators.auth.port')"
            case "$CI_AUTH_EMULATOR_PORT" in
              ''|*[!0-9]*) echo "FAIL: could not determine the configured Auth emulator port from firebase.json" >&2; exit 1 ;;
            esac
            export CI_AUTH_EMULATOR_PORT
            echo "connection shim scope: Auth emulator 127.0.0.1:$CI_AUTH_EMULATOR_PORT only, this step only"
            psql -h localhost -p 28110 -U postgres -c "CREATE DATABASE eleventhonus_platform_local"
            node tests/preview/cross-project-acceptance.mjs
      - oidc_guard
      - run:
          name: Stop Founder Preview (cleanup)
          working_directory: ~/project
          when: always
          command: |
            # Runs even after failures (when: always), so it carries its own inline OIDC gate.
            if [ -n "${CIRCLE_OIDC_TOKEN-}${CIRCLE_OIDC_TOKEN_V2-}" ]; then
              echo "FAIL: a CircleCI OIDC variable is present; refusing to execute application code" >&2
              exit 1
            fi
            if [ -n "${SSH_AUTH_SOCK-}${SSH_AGENT_PID-}" ]; then
              echo "FAIL: an SSH agent variable is present; refusing to execute application code" >&2
              exit 1
            fi
            if [ "${PILOT_ISOLATION_ACTIVE-}" != 1 ]; then
              echo "FAIL: the BASH_ENV isolation file was not sourced; refusing to execute application code" >&2
              exit 1
            fi
            pnpm preview:stop || true
      - run:
          name: Assert no connection shim is active for emulator validation
          command: |
            # Evidence that `pnpm emulators:validate` (next step) runs unshimmed: the preload was scoped to the
            # cross-project acceptance step, its file is removed on that step's exit, and none of its settings leak.
            if [ -n "${CI_AUTH_EMULATOR_PORT:-}" ] || [ -e /tmp/ci-auth-emulator-connection-close.cjs ]; then
              echo "FAIL: the Auth emulator connection shim is still present" >&2; exit 1
            fi
            case "${NODE_OPTIONS:-}" in
              *ci-auth-emulator-connection-close*) echo "FAIL: NODE_OPTIONS still references the connection shim" >&2; exit 1 ;;
            esac
            echo "OK: no connection shim is active (NODE_OPTIONS=${NODE_OPTIONS:-<unset>}, preload file absent, CI_AUTH_EMULATOR_PORT unset)"
      - oidc_guard
      - run:
          {
            name: Firebase Emulator Suite validation,
            working_directory: ~/project,
            no_output_timeout: 20m,
            command: pnpm emulators:validate,
          }

      - run:
          name: Final exact-head re-assertion
          working_directory: ~/project
          when: always
          command: |
            echo "final HEAD  $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
      - store_artifacts:
          path: /tmp/exact-head-evidence.json
          destination: exact-head-evidence.json
          when: always
      - store_artifacts:
          path: ~/project/playwright-report
          destination: playwright-report
          when: always
      - store_artifacts:
          path: ~/project/test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: ~/project/.preview/logs
          destination: preview-logs
          when: always

workflows:
  # One workflow, one job, one run per API trigger. Starts only when `expected_sha` is supplied,
  # so ordinary pushes (OAuth all-pushes trigger, if any) start nothing and consume no credits.
  temporary-ci-continuity:
    when: << pipeline.parameters.expected_sha >>
    jobs:
      - verify:
          name: circleci-continuity-verify
