# 11THONUS-CI-CONT-002 — TEMPORARY CircleCI CONTINUITY PILOT CONFIG
#
# TEMPORARY, REVERSIBLE. GitHub Actions (`.github/workflows/ci.yml`) remains the primary CI system.
# This file lives only on the pilot branch `docs/ci-cont-001-circleci-assessment` and is NOT part of
# any PR under test. A CircleCI pass is independent evidence; it is NOT a GitHub Actions pass.
# Remove with the rollback in docs/05-implementation/reports/11THONUS-CI-CONT-001-*.md.
#
# How it tests a PR head WITHOUT committing config onto the PR:
#   1. The pipeline is triggered on THIS config branch (manual/checkpoint trigger) with the pipeline
#      parameters `expected_sha` (+ optional `pr_number`).
#   2. The first step fetches `refs/pull/<pr_number>/head`, checks out that exact commit and FAILS
#      CLOSED unless  fetched SHA == checked-out SHA == expected SHA == live GitHub PR head SHA.
#   3. Every later step runs the repository's own scripts from the target tree, in the same order as
#      `.github/workflows/ci.yml`. No deployment, no secrets, demo-11thonus emulator project only.
#
# Trigger types:
#   * manual/API/UI run  -> `expected_sha` parameter is REQUIRED (never inferred from the branch).
#   * GitHub App PR event -> `pipeline.event.github.pull_request.head.sha` is used when
#     `expected_sha` is empty. Not populated for manual runs; never assumed.
#   * push events with neither value set do not start the workflow (no credit use).

version: 2.1

parameters:
  expected_sha:
    type: string
    default: ""
  pr_number:
    type: string
    default: ""

jobs:
  verify:
    docker:
      - image: cimg/node:20.19
      # Same image, credential, database and port as the GitHub Actions service container.
      - image: postgres:16-alpine
        command: ["postgres", "-p", "28110"]
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eleventhonus_platform_test
    resource_class: large # Docker large: 4 vCPU / 8 GB (verify credit rate in the UI before running)
    environment:
      CI: "true"
    steps:
      - checkout

      - run:
          name: Exact-head verification (fail closed)
          command: |
            set -eu
            EVIDENCE=/tmp/exact-head-evidence.txt
            EXPECTED="<< pipeline.parameters.expected_sha >>"
            SOURCE="pipeline parameter expected_sha (manual/checkpoint)"
            PR="<< pipeline.parameters.pr_number >>"
            if [ -z "$EXPECTED" ]; then
              EXPECTED="<< pipeline.event.github.pull_request.head.sha >>"
              SOURCE="pipeline.event.github.pull_request.head.sha (PR event)"
              PR="<< pipeline.event.github.pull_request.number >>"
            fi
            {
              echo "trigger.type          : << pipeline.trigger.type >>"
              echo "event                 : << pipeline.event.name >>"
              echo "config branch/rev     : << pipeline.git.branch >> @ << pipeline.git.revision >>"
              echo "expected SHA          : ${EXPECTED:-<none>}"
              echo "expected SHA source   : $SOURCE"
              echo "PR number             : ${PR:-<none>}"
            } | tee "$EVIDENCE"
            if ! printf '%s' "$EXPECTED" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "FAIL: expected SHA missing or not a 40-char lowercase SHA" | tee -a "$EVIDENCE"; exit 1
            fi
            if [ -n "$PR" ]; then
              git fetch --no-tags origin "refs/pull/$PR/head"
            else
              git fetch --no-tags origin "$EXPECTED"
            fi
            FETCHED="$(git rev-parse FETCH_HEAD)"
            git checkout --detach "$EXPECTED"
            CHECKED_OUT="$(git rev-parse HEAD)"
            LIVE="n/a (no PR number)"
            if [ -n "$PR" ]; then
              LIVE="$(curl -fsS "https://api.github.com/repos/Fkenogo/11THONUS/pulls/$PR" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).head.sha))' || true)"
              [ -n "$LIVE" ] || { echo "FAIL: could not read live PR head from GitHub API" | tee -a "$EVIDENCE"; exit 1; }
            fi
            {
              echo "fetched ref SHA       : $FETCHED"
              echo "checked-out SHA       : $CHECKED_OUT"
              echo "live GitHub PR head   : $LIVE"
            } | tee -a "$EVIDENCE"
            [ "$CHECKED_OUT" = "$EXPECTED" ] || { echo "FAIL: checked-out != expected" | tee -a "$EVIDENCE"; exit 1; }
            [ "$FETCHED" = "$EXPECTED" ] || { echo "FAIL: fetched ref != expected" | tee -a "$EVIDENCE"; exit 1; }
            if [ -n "$PR" ] && [ "$LIVE" != "$EXPECTED" ]; then
              echo "FAIL: live PR head != expected (PR moved)" | tee -a "$EVIDENCE"; exit 1
            fi
            echo "RESULT: EXACT-HEAD MATCH CONFIRMED" | tee -a "$EVIDENCE"

      - run:
          name: Install pnpm 9.15.9
          command: npm install -g pnpm@9.15.9
      - run:
          name: Install JDK 21 (Firestore Emulator requires Java >= 21) and psql
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-21-jre-headless postgresql-client
            java -version
      - run: pnpm install --frozen-lockfile
      - run:
          name: Wait for PostgreSQL service container
          command: for i in $(seq 1 30); do PGPASSWORD=postgres pg_isready -h localhost -p 28110 -U postgres && exit 0; sleep 2; done; exit 1

      - run: { name: Build, command: pnpm build }
      - run: { name: Lint, command: pnpm lint }
      - run: { name: Format check, command: pnpm format:check }
      - run: { name: Typecheck, command: pnpm typecheck }
      - run: { name: Unit / component tests, command: pnpm test }
      - run:
          name: PostgreSQL integration tests (Firestore emulator wrapped)
          no_output_timeout: 20m
          command: >-
            pnpm exec firebase emulators:exec --only firestore --project demo-11thonus
            "PLATFORM_ENV=test PLATFORM_POSTGRES_URL=postgres://postgres:postgres@localhost:28110/eleventhonus_platform_test pnpm --filter functions test:postgres"
      - run:
          {
            name: Install Playwright Chromium,
            command: pnpm exec playwright install --with-deps chromium,
          }
      - run: { name: Playwright e2e, command: pnpm test:e2e }
      - run: { name: Founder Preview tooling tests, command: pnpm test:preview-tooling }
      - run:
          name: Founder Preview cross-project port-isolation acceptance
          environment:
            PREVIEW_POSTGRES_URL: postgres://postgres:postgres@localhost:28110/eleventhonus_platform_local
            PGPASSWORD: postgres
          command: |
            psql -h localhost -p 28110 -U postgres -c "CREATE DATABASE eleventhonus_platform_local"
            node tests/preview/cross-project-acceptance.mjs
      - run:
          name: Stop Founder Preview (cleanup)
          when: always
          command: pnpm preview:stop || true
      - run: { name: Firebase Emulator Suite validation, command: pnpm emulators:validate }

      - run:
          name: Final exact-head re-assertion
          when: always
          command: |
            echo "final HEAD  $(git rev-parse HEAD)" | tee -a /tmp/exact-head-evidence.txt
      - store_artifacts:
          path: /tmp/exact-head-evidence.txt
          destination: exact-head-evidence.txt
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: .preview/logs
          destination: preview-logs

workflows:
  # One workflow, one job, one run per trigger. Starts only when an expected SHA is available
  # (manual parameter or PR-event head SHA); plain pushes consume no credits.
  temporary-ci-continuity:
    when:
      or:
        - << pipeline.parameters.expected_sha >>
        - << pipeline.event.github.pull_request.head.sha >>
    jobs:
      - verify:
          name: circleci-continuity-verify
