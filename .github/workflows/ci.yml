name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to avoid queueing stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Test, Emulator Validation
    runs-on: ubuntu-latest
    # This pipeline requires zero secrets: the Firebase Emulator Suite runs
    # against the fake `demo-11thonus` project ID, and the PostgreSQL
    # integration tests run against an isolated, ephemeral, in-job service
    # container (`postgres:16-alpine`) with a well-known dev credential —
    # nothing talks to any external, hosted, or authenticated service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eleventhonus_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before actions/setup-node's `cache: pnpm` option
      # can detect it, so pnpm is installed first.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / component tests
        run: pnpm test

      # The Firestore Emulator requires a JRE, and firebase-tools now refuses
      # to run it on Java below 21. GitHub's ubuntu-latest runner's default
      # `java` resolves to Temurin 17 (confirmed by CI run 29608691029,
      # 2026-07-17: "firebase-tools no longer supports Java version before
      # 21"), so JDK 21 is installed explicitly rather than assumed. Moved
      # ahead of the PostgreSQL step (`PLATFORM-BASELINE-005A-CORR-001`):
      # the Reward Program cross-store command test needs the Firestore
      # Emulator running alongside the PostgreSQL service container, so
      # Java must already be in place before that step runs.
      - name: Set up Java (JDK 21+ required by the Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java runtime (required by the Firestore Emulator)
        run: java -version

      # PostgreSQL integration tests run against the in-job service container
      # above (no Docker Compose, no external database, no secret). The
      # runner waits for the container's `pg_isready` health check before
      # reaching this step. Wrapped in the Firestore Emulator
      # (`PLATFORM-BASELINE-005A-CORR-001`): the Reward Program cross-store
      # command test (`rewardProgramCommands.postgres.test.ts`) requires
      # BOTH a live PostgreSQL instance AND `FIRESTORE_EMULATOR_HOST` set --
      # running the bare vitest command here (as originally shipped) let
      # that file fail its own env-guard on every CI run, undetected because
      # the original implementation never actually checked CI status before
      # reporting success. Mirrors the exact command validated locally.
      - name: PostgreSQL integration tests
        env:
          PLATFORM_ENV: test
          PLATFORM_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/eleventhonus_platform_test
        run: >-
          pnpm exec firebase emulators:exec --only firestore --project demo-11thonus
          "PLATFORM_ENV=test PLATFORM_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/eleventhonus_platform_test pnpm --filter functions test:postgres"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright e2e
        run: pnpm test:e2e

      - name: Firebase Emulator Suite validation
        run: pnpm emulators:validate

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            firebase-debug.log
            firestore-debug.log
